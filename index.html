<!DOCTYPE html>
<html lang="ro">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#14231f">
	<title>Salut, lume! | Laborator 5</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #14231f;
			--paper: #f5f2e8;
			--lime: #d3f36b;
			--coral: #ff765e;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			overflow: hidden;
			background: var(--ink);
			color: var(--paper);
			font-family: Georgia, "Times New Roman", serif;
		}

		.scene {
			position: relative;
			display: grid;
			min-height: 100vh;
			min-height: 100svh;
			place-items: center;
			isolation: isolate;
			overflow: hidden;
		}

		.scene::before,
		.scene::after {
			position: absolute;
			z-index: -1;
			pointer-events: none;
			content: "";
		}

		.scene::before {
			inset: -45%;
			background-image:
				linear-gradient(rgb(245 242 232 / 7%) 1px, transparent 1px),
				linear-gradient(90deg, rgb(245 242 232 / 7%) 1px, transparent 1px);
			background-size: 72px 72px;
			mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
			animation: grid-drift 32s ease-in-out infinite alternate;
		}

		.scene::after {
			top: 0;
			bottom: 0;
			left: -40%;
			width: 35%;
			border-right: 1px solid rgb(211 243 107 / 35%);
			background: linear-gradient(90deg, transparent, rgb(211 243 107 / 5%), transparent);
			transform: skewX(-18deg);
			animation: light-sweep 12s ease-in-out infinite;
		}

		.intro {
			width: min(100% - 48px, 1000px);
			padding: 48px 0;
			animation: reveal 900ms cubic-bezier(.2, .75, .25, 1) both;
		}

		.eyebrow {
			display: flex;
			align-items: center;
			gap: 12px;
			margin: 0 0 28px;
			color: var(--lime);
			font: 600 12px/1.4 "Courier New", monospace;
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		.eyebrow::before {
			width: 28px;
			height: 1px;
			background: var(--coral);
			content: "";
		}

		h1 {
			max-width: 900px;
			margin: 0;
			font-size: 112px;
			font-weight: 400;
			line-height: .92;
		}

		h1 span {
			color: var(--lime);
			font-style: italic;
		}

		.welcome {
			max-width: 380px;
			margin: 32px 0 0 8px;
			color: rgb(245 242 232 / 72%);
			font: 16px/1.7 "Courier New", monospace;
		}

		.index {
			position: absolute;
			right: 32px;
			bottom: 28px;
			color: rgb(245 242 232 / 45%);
			font: 11px/1.4 "Courier New", monospace;
			letter-spacing: 1px;
		}

		@keyframes grid-drift {
			from { transform: translate3d(-18px, 12px, 0) rotate(-4deg); }
			to { transform: translate3d(18px, -12px, 0) rotate(1deg); }
		}

		@keyframes light-sweep {
			0%, 15% { left: -40%; opacity: 0; }
			35% { opacity: 1; }
			75%, 100% { left: 110%; opacity: 0; }
		}

		@keyframes reveal {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 600px) {
			h1 { font-size: 64px; }
			.intro { width: calc(100% - 40px); }
			.welcome { margin-left: 2px; font-size: 14px; }
			.index { right: 20px; bottom: 20px; }
			.scene::before { background-size: 48px 48px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				scroll-behavior: auto !important;
			}
		}
	</style>
</head>
<body>
	<main class="scene">
		<section class="intro" aria-labelledby="greeting">
			<p class="eyebrow">Laborator 05 · Proiect web</p>
			<h1 id="greeting">Salut,<br><span>lume!</span></h1>
			<p class="welcome">Bine ați venit pe pagina mea web.</p>
		</section>
		<span class="index" aria-hidden="true">RO / 001</span>
	</main>
</body>
</html>
