  <text x="66" y="635" fill="#ff8fc7" font-family="Courier New, monospace" font-size="15">01</text>
  <text x="112" y="635" fill="#f5f2e8" font-family="Courier New, monospace" font-size="15" font-weight="bold">index.html</text>
  <text x="112" y="663" fill="#f5f2e8" fill-opacity=".62" font-family="Courier New, monospace" font-size="13">Pagina principala a proiectului.</text>
  <path d="M64 694H836" stroke="#f5f2e8" stroke-opacity=".12"/>
  <text x="66" y="718" fill="#f5f2e8" fill-opacity=".46" font-family="Courier New, monospace" font-size="11" letter-spacing="1">HTML / BROWSER / PROIECT STATIC</text>
  <text x="834" y="718" fill="#f5f2e8" fill-opacity=".46" font-family="Courier New, monospace" font-size="11" text-anchor="end">LABORATOR 05</text>
 </svg>